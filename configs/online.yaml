inherit: model.yaml
mode: online
objective: paired_pg

board_size: 8
initial_length: 3
event_horizon: 16
episode_horizon: 256
outcomes: [collision, timeout, food]
utilities: [-1.0, 0.0, 1.0]

max_policy_generations: 3
min_optimizer_steps_per_policy: 1000
max_optimizer_steps_per_policy: 5000
promotion_interval_steps: 1000
max_total_optimizer_steps: 15000

source_envs: 64
behavior_epsilon: 0.20
select_every: 1
effective_batch: 256
microbatch: 128

backbone_lr: 0.00002
head_lr: 0.0002
weight_decay: 0.01
warmup_steps: 50
eval_every: 100
reward_samples: 32
baseline: conditional

inference_questions: 256
validation_events: 1024
mc_states: 32
mc_rollouts: 32
promotion_games: 128
test_games: 256
game_batch: 128
promotion_min_food_gain: 0.0
promotion_z: 1.645
save_optimizer: true
initial_checkpoint: ""
