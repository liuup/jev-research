# Fast look at the whole loop: three short generations, roughly 25 minutes end to end.
# Same objective, data split and schedule shape as configs/train.yaml, only smaller.
# Measured cost model: collection dominates (about 3.3 states/s), so problem count is
# the knob that controls wall-clock time here.
inherit: train.yaml
generations: 3
problems_per_generation: 100
rollouts_per_problem: 4
max_steps: 8
steps_per_generation: 40
validation_problems: 64
test_problems: 64
action_reference_problems: 1
action_reference_repeats: 2
