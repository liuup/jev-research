# Ten-step smoke run: tiny collection, tiny training, one generation.
inherit: train.yaml
generations: 1
puzzles_per_generation: 16
rollouts_per_puzzle: 2
steps_per_generation: 10
effective_batch: 8
microbatch: 4
warmup_steps: 1
validation_puzzles: 8
test_puzzles: 8
init_policy: solver_mix
init_solver_mix: 0.5
rollout_mode: sample
max_length: 256
