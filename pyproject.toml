[project]
name = "jev-online-snake"
version = "0.1.0"
description = "Pure-online RLCD-inspired outcome prediction and policy improvement for Snake"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch>=2.9,<2.11",
  "transformers>=5.3,<5.6",
  "safetensors>=0.7",
  "numpy>=2",
  "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jevsnake"]

[tool.ruff.lint]
select = ["E402", "PLC0415"]
