[project]
name = "jev2048"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = ["torch==2.9.1", "transformers==5.3.0", "safetensors>=0.7", "numpy>=2", "pyyaml>=6", "tqdm>=4", "matplotlib>=3.10"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E402", "PLC0415"]
