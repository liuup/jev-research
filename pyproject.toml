[project]
name = "jevmath"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch==2.9.1",
    "transformers==5.3.0",
    "safetensors>=0.7",
    "numpy>=2",
    "pyyaml>=6",
    "tqdm>=4",
    "matplotlib>=3.10",
    "flash-linear-attention[conv1d,cuda]>=0.5.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jevmath"]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }

[tool.uv.extra-build-dependencies]
causal-conv1d = [{ requirement = "torch", match-runtime = true }]

[tool.uv.extra-build-variables]
causal-conv1d = { TORCH_CUDA_ARCH_LIST = "12.0" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E402", "PLC0415"]
